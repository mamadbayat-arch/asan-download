<!doctype html>
<html lang="fa" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>آسان دانلود</title><link rel="stylesheet" href="popup.css"></head>
<body>
<header><img class="logo" src="icon128.png" width="48" height="48" alt="نشان آسان دانلود"><div><h1>اتصال به آسان دانلود</h1><small>دریافت فایل‌ها با برنامهٔ ویندوز</small></div></header>
<label class="toggle"><input id="enabled" type="checkbox"><span>دریافت دانلودهای مرورگر</span></label>
<p class="help">پس از کلیک روی لینک فایل، دانلود با تأیید شما در برنامه شروع می‌شود.</p>
<button id="connect" type="button">بررسی اتصال به برنامه</button>
<p id="status" role="status" aria-live="polite">برای شروع، دکمهٔ بررسی اتصال را بزنید.</p>
<footer>نسخهٔ افزونه: ۱.۸.۱</footer><script src="popup.js"></script>
</body></html>
