<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>گزارش مشکلات | آسان دانلود</title><link rel="stylesheet" href="/style.css"><script src="/reports.js" defer></script></head><body><header class="nav wrap"><a href="/"><img class="wordmark" src="/assets/asan-download.png" alt="آسان دانلود" width="220" height="73"></a><a href="/admin">مدیریت تبلیغات</a></header><main class="admin-main wrap"><section class="admin-card" id="login-card"><h1>گزارش مشکلات کاربران</h1><p class="help">با حساب مدیریت برنامه وارد شوید.</p><form id="login-form"><div class="field"><label for="username">نام کاربری</label><input id="username" value="admin" autocomplete="username" required></div><div class="field"><label for="password">رمز مدیریت</label><input id="password" type="password" autocomplete="current-password" required></div><button class="primary">ورود</button></form></section><div id="notice" class="notice" role="status" aria-live="polite"></div><section id="reports-card" class="admin-card" hidden><div class="admin-actions"><h1>گزارش مشکلات</h1><button class="small-button" id="refresh">تازه‌سازی</button><button class="small-button" id="logout">خروج</button></div><p class="help">گزارش را باز کنید، وضعیت پیگیری و یادداشت داخلی را ثبت کنید.</p><div class="field"><label for="filter">وضعیت</label><select id="filter"><option value="all">همه</option><option value="new">جدید</option><option value="in_progress">در حال بررسی</option><option value="resolved">حل‌شده</option></select></div><div id="report-list"></div><button id="more" class="small-button" hidden>نمایش گزارش‌های بیشتر</button></section></main></body></html>
